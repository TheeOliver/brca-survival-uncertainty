# Post hoc stress tests of the frozen METABRIC models and test patients.
distribution_shift:
  alphas: [0.20, 0.10, 0.05]
  horizons_months: [120.0, 300.0]
  report_alpha: 0.10
  report_horizon_months: 120.0
  bootstrap_replicates: 1000
  confidence_level: 0.95
  minimum_success_fraction: 0.90
  scenarios:
    baseline:
      kind: baseline
    younger:
      kind: age_tilt
      column: age_at_diagnosis
      beta: -0.5
      z_clip: 2.0
    older:
      kind: age_tilt
      column: age_at_diagnosis
      beta: 0.5
      z_clip: 2.0
    basal_enriched:
      kind: categorical_multiplier
      column: pam50_subtype
      value: Basal
      factor: 2.0
